name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run NPM Audit (Frontend)
        run: npm audit --audit-level=moderate
        continue-on-error: true # Don't fail the build on moderate vulnerabilities unless desired

      - name: Run NPM Audit (Backend)
        working-directory: ./server
        run: npm audit --audit-level=moderate
        continue-on-error: true
